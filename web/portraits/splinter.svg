<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" role="img" aria-labelledby="title desc">
  <title id="title">Master Splinter portrait</title>
  <desc id="desc">A stylized rat sensei portrait with whiskers and wise expression.</desc>
  <defs>
    <linearGradient id="splinter-fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b5d4f"/>
      <stop offset="100%" stop-color="#3d302a"/>
    </linearGradient>
    <linearGradient id="splinter-beard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a3d35"/>
      <stop offset="100%" stop-color="#2a1f17"/>
    </linearGradient>
  </defs>
  <rect width="220" height="220" fill="#f4eddc"/>
  
  <!-- Left ear -->
  <ellipse cx="50" cy="45" rx="18" ry="28" fill="url(#splinter-fur)" stroke="#2a1f17" stroke-width="3" transform="rotate(-30 50 45)"/>
  <ellipse cx="50" cy="45" rx="10" ry="18" fill="#a89480" transform="rotate(-30 50 45)"/>
  
  <!-- Right ear -->
  <ellipse cx="170" cy="45" rx="18" ry="28" fill="url(#splinter-fur)" stroke="#2a1f17" stroke-width="3" transform="rotate(30 170 45)"/>
  <ellipse cx="170" cy="45" rx="10" ry="18" fill="#a89480" transform="rotate(30 170 45)"/>
  
  <!-- Head -->
  <ellipse cx="110" cy="100" rx="75" ry="80" fill="url(#splinter-fur)" stroke="#2a1f17" stroke-width="6"/>
  
  <!-- Snout -->
  <ellipse cx="110" cy="128" rx="48" ry="42" fill="#8b7b6d" stroke="#3d302a" stroke-width="3"/>
  
  <!-- Beard/whiskers area -->
  <path d="M60 132 Q55 138, 50 140" fill="none" stroke="#4a3d35" stroke-width="5" stroke-linecap="round"/>
  <path d="M170 132 Q175 138, 180 140" fill="none" stroke="#4a3d35" stroke-width="5" stroke-linecap="round"/>
  <path d="M65 145 Q55 148, 45 148" fill="none" stroke="#4a3d35" stroke-width="4" stroke-linecap="round"/>
  <path d="M175 145 Q185 148, 195 148" fill="none" stroke="#4a3d35" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Nose -->
  <ellipse cx="110" cy="130" rx="10" ry="8" fill="#2a1f17"/>
  
  <!-- Eyes -->
  <ellipse cx="82" cy="88" rx="16" ry="14" fill="#fff"/>
  <ellipse cx="138" cy="88" rx="16" ry="14" fill="#fff"/>
  <circle cx="82" cy="88" r="7" fill="#202020"/>
  <circle cx="138" cy="88" r="7" fill="#202020"/>
  <circle cx="84" cy="85" r="2.5" fill="#fff"/>
  <circle cx="140" cy="85" r="2.5" fill="#fff"/>
  
  <!-- Wise expression lines -->
  <path d="M75 115 Q70 120, 68 125" fill="none" stroke="#3d302a" stroke-width="2" opacity="0.5"/>
  <path d="M145 115 Q150 120, 152 125" fill="none" stroke="#3d302a" stroke-width="2" opacity="0.5"/>
  
  <!-- Mouth -->
  <path d="M100 145 Q110 152, 120 145" fill="none" stroke="#2a1f17" stroke-width="4" stroke-linecap="round"/>
</svg>
